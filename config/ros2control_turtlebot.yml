tb/controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

tb/diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["left wheel motor"]
    right_wheel_names: ["right wheel motor"]

    wheel_separation: 0.16
    wheel_radius: 0.033

    # The real separation between wheels is not resulting in a perfect odometry
    wheel_separation_multiplier: 1.112

    use_stamped_vel: false
    # Frames PREFIJADOS tb_ para no chocar con el base_link del UR5e (que ya vive en el /tf global).
    # diff_drive publica tb_odom -> tb_base_link.
    base_frame_id: "tb_base_link"
    odom_frame_id: "tb_odom"
    enable_odom_tf: true
    # CRITICO para Nav2: por defecto (tf_frame_prefix_enable:true + prefix vacío) el controlador
    # ANTEPONE el namespace -> publica "tb/tb_odom"->"tb/tb_base_link", que NO conecta con el TF
    # estático map->tb_odom ni con el rsp (tb_base_link->tb_base_scan), ambos SIN prefijo -> árboles TF
    # desconectados y el global_costmap de Nav2 no activa. Con false usa los frames literales de arriba.
    tf_frame_prefix_enable: false

    linear:
      x:
        max_velocity: 0.2 # Maximal speed of turtlebot

tb/joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - LDS-01_secondary_motor
      - LDS-01_main_motor
