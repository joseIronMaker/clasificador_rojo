# Nav2 params — TurtleBot3 Burger de Etapa 3 (ROS2 Jazzy, Nav2 1.3.11). MINIMO para WSL2 sin GPU:
# solo map_server + planner (NavFn) + controller (RPP) + behavior + bt_navigator (sin smoother,
# route, docking, collision_monitor, velocity_smoother). Lanzado con su propio lifecycle_manager.
#
# Frames PREFIJADOS tb_ (tb_base_link, tb_odom, tb_base_scan) para NO chocar con el UR5e (que vive en
# el /tf global world->base_link->tool0 para el agarre). map->tb_odom es ESTATICO (sin AMCL): el odom
# del diff_drive no deriva en un trayecto tan corto -> map == world y los goals van en coords del mundo.
# enable_stamped_cmd_vel: true -> Nav2 publica geometry_msgs/TwistStamped en cmd_vel (lo que el
# diff_drive de Jazzy espera; verificado: /tb/diffdrive_controller/cmd_vel es TwistStamped).

map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    # yaml_filename lo fija el launch (ruta absoluta a mapa_libre.yaml).

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    odom_topic: /tb/diffdrive_controller/odom   # el odom del diff_drive (no el /odom por defecto)
    enable_stamped_cmd_vel: true          # -> publica TwistStamped en cmd_vel (diff_drive Jazzy)
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Relajado: en WSL2 el arranque de la ruta es lento; con 0.5 m/10 s abortaba la vuelta al dock
      # (la caja iba a la banda y el robot apenas se movía) -> el ciclo se reiniciaba con el robot lejos.
      required_movement_radius: 0.3
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # RPP (Regulated Pure Pursuit): ligero (sin muestreo de trayectorias) -> ideal en WSL2 sin GPU.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.17 (no 0.22 máx): el motor de rueda del Burger satura a 6.67 rad/s; a 0.2 m/s + giro la rueda
      # externa pedía ~6.8 -> WARNING "exceeds maxVelocity" en bucle (inocuo, Webots lo recorta). A 0.17
      # las ruedas quedan bajo el límite y la consola no se inunda.
      desired_linear_vel: 0.17
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: tb_odom
      robot_base_frame: tb_base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.12          # TurtleBot3 Burger (~0.105 m)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2   # 0.2 (no 0.3): el dock está a 0.3 m del pedestal -> alcanzable y la
                                # caja salta menos al montarse cuando el robot vuelve al dock en reset
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: tb_base_link
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: false
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.2   # 0.2 (no 0.3): el dock está a 0.3 m del pedestal -> alcanzable y la
                                # caja salta menos al montarse cuando el robot vuelve al dock en reset
      always_send_full_costmap: True

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: tb_odom
    global_frame: map
    robot_base_frame: tb_base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: tb_base_link
    odom_topic: /tb/diffdrive_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
